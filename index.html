<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>CSC3058 Architecture Notes</title>
    <script>
      (function () {
        var r = document.documentElement, t = 'system';
        try {
          var s = JSON.parse(localStorage.getItem('csc3058-revision-v1') || '{}');
          r.setAttribute('data-palette', 'tokyo');
          if (s.theme === 'light' || s.theme === 'dark') {
            t = s.theme;
            r.setAttribute('data-theme', t);
          }
        } catch (e) {}
        if (t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
          r.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="mount"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
